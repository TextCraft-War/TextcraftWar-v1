#:schema ./schema.json
[workspace]
resolver = "3"
members = ["crates/domain", "crates/protocol", "crates/storage", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Oppenheymu <oppenheymu@gmail.com>"]
license = "MIT"
description = "A high-performance multiplayer text strategy game server"
repository = "https://github.com/textcraftwar/textcraftwar"
keywords = ["game", "multiplayer", "text", "strategy", "server"]
categories = ["games", "web-programming"]

[workspace.dependencies]
# 异步运行时与网络：只启用实际用得到的 feature，不用 "full"
tokio = { version = "1.40", features = [
    "rt-multi-thread",
    "net",
    "macros",
    "time",
    "sync",
    "signal",
] }
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 持久化：sqlx 直写 SQL，没有 ORM 魔法。
# 刻意不带 `sqlx::query!` 之外需要的构建期数据库：默认用 `query_as` 运行期校验，
# 保证 `cargo check` 在没连 PostgreSQL 的机器（含 CI/新克隆）上也能过。
sqlx = { version = "0.8", default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls",
    "macros",
    "migrate",
] }

# 工具
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 随机：6 位编号、跨平台绑定口令。只在 `server` 里用——
# `domain` 把随机源当参数（规则必须可复现），`storage` 不该知道编号从哪来。
rand = "0.9"

# i18n：v1 只有中文，先不引入。等多语言是真实需求时再启用
# （注意 fluent 的 FluentBundle 不是 Sync，届时需要单独的渲染线程方案）。
# fluent = "0.17"
# unic-langid = "0.9"

# 工作区内部 crate
domain = { path = "crates/domain" }
protocol = { path = "crates/protocol" }
storage = { path = "crates/storage" }
server = { path = "crates/server" }

# Release：最大化优化与体积压缩
[profile.release]
# 最高优化等级
opt-level = 3
# 胖 LTO，跨 crate 内联优化
lto = "fat"
# 单编译单元，最大化内联与去虚拟化
codegen-units = 1
# 去除 unwinding 表，缩小体积并加速
panic = "abort"
# 剥离符号表
strip = "symbols"
# 非增量编译，避免额外开销
incremental = false

# dev：本地 crate 不优化以加快编译
[profile.dev]
opt-level = 0

[profile.dev.package."*"]
# 对依赖开启优化，加快 debug 构建运行速度
opt-level = 2

# ---------------------------------------------------------------------------
# 质量门槛
#
# 原则：**只有"会变成线上事故"的规则才 deny**，风格类一律 warn。
# 之前那套（pedantic + nursery 全 deny、60 行函数、全字段文档）是金融系统的标准，
# 对付一个 2 人规模的文游属于自缚手脚。
# ---------------------------------------------------------------------------

[workspace.lints.rust]
# 内存安全底线，永不放宽
unsafe_code = "forbid"
# 时代正确性（未标注生命周期、隐式 ABI 等），保留 deny
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
missing_abi = "deny"
keyword_idents = { level = "deny", priority = -1 }
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(tokio_unstable)"] }

# 以下为"看得见但不挡路"的风格类，降为 warn
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
unused_crate_dependencies = "warn"
variant_size_differences = "warn"
missing_docs = "warn"
elided_lifetimes_in_paths = "warn"
elided_lifetimes_in_associated_constant = "warn"
deprecated_safe = { level = "warn", priority = -1 }
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"

# 中文标识符是本项目的前提，必须放开
non_ascii_idents = "allow"

[workspace.lints.clippy]
# `all` 是真正能抓 bug 的组，保留 deny
all = { level = "deny", priority = -1 }
# pedantic / nursery 边界模糊、误报多，降为 warn
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# 调试与日志
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

# 失败处理：保留 deny。
# 理由：游戏服务器里一次 unwrap 失败 = 整个 WS 连接甚至进程挂掉，
# 这个代价远高于"多写一个 match"。（测试代码已在 .clippy.toml 里单独放开）
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"

# 数值安全：v1 经济全部走整数，这几条不会误伤，保留
cast_precision_loss = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"

# 并发安全：持锁 await 是死锁源，保留
await_holding_lock = "deny"

# 其余从 deny 降为 warn
let_underscore_must_use = "warn"
wildcard_enum_match_arm = "warn"
exit = "warn"
needless_pass_by_ref_mut = "warn"
use_self = "warn"
default_trait_access = "warn"
large_futures = "warn"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"

# pedantic 中确认为噪音的子规则
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_trait_methods = "allow"
single_call_fn = "allow"

# 因显式引入部分 restriction lint，必须豁免其元 lint
blanket_clippy_restriction_lints = "allow"

# Rustdoc：断链是真错误，保留 deny；其余文档风格降为 warn
[workspace.lints.rustdoc]
all = "warn"
missing_crate_level_docs = "warn"
broken_intra_doc_links = "deny"
