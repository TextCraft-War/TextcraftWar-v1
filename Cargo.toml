#:schema ./schema.json
[workspace]
resolver = "3"
members = ["crates/domain", "crates/protocol", "crates/storage", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Oppenheymu <oppenheymu@gmail.com>"]
license = "MIT"
description = "A high-performance multiplayer text strategy game server"
repository = "https://github.com/textcraftwar/textcraftwar"
keywords = ["game", "multiplayer", "text", "strategy", "server"]
categories = ["games", "web-programming"]

[workspace.dependencies]
# 异步运行时与网络：只启用实际用得到的 feature，不用 "full"
tokio = { version = "1.40", features = [
    "rt-multi-thread",
    "net",
    "macros",
    "time",
    "sync",
    "signal",
] }
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 持久化：sqlx 直写 SQL，没有 ORM 魔法。
# 刻意不带 `sqlx::query!` 之外需要的构建期数据库：默认用 `query_as` 运行期校验，
# 保证 `cargo check` 在没连 PostgreSQL 的机器（含 CI/新克隆）上也能过。
sqlx = { version = "0.8", default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls",
    "macros",
    "migrate",
] }

# 工具
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# i18n：v1 只有中文，先不引入。等多语言是真实需求时再启用
# （注意 fluent 的 FluentBundle 不是 Sync，届时需要单独的渲染线程方案）。
# fluent = "0.17"
# unic-langid = "0.9"

# 工作区内部 crate
domain = { path = "crates/domain" }
protocol = { path = "crates/protocol" }
storage = { path = "crates/storage" }
server = { path = "crates/server" }

# Release：最大化优化与体积压缩
[profile.release]
# 最高优化等级
opt-level = 3
# 胖 LTO，跨 crate 内联优化
lto = "fat"
# 单编译单元，最大化内联与去虚拟化
codegen-units = 1
# 去除 unwinding 表，缩小体积并加速
panic = "abort"
# 剥离符号表
strip = "symbols"
# 非增量编译，避免额外开销
incremental = false

# dev：本地 crate 不优化以加快编译
[profile.dev]
opt-level = 0

[profile.dev.package."*"]
# 对依赖开启优化，加快 debug 构建运行速度
opt-level = 2

# Workspace lints：统一严格质量门槛，默认 deny
[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_lifetimes = "deny"
unused_crate_dependencies = "deny"
variant_size_differences = "deny"
missing_docs = "deny"
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(tokio_unstable)"] }
elided_lifetimes_in_paths = "deny"
elided_lifetimes_in_associated_constant = "deny"
deprecated_safe = { level = "deny", priority = -1 }
keyword_idents = { level = "deny", priority = -1 }
missing_abi = "deny"
non_ascii_idents = "allow"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unit_bindings = "deny"

[workspace.lints.clippy]
# 组级别开启主流质量与风格门槛；priority = -1 让后续子规则可覆盖
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

# 显式 opt-in：真正有价值的 restriction lint（不全局开启 restriction 组）
# 调试与日志
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
# 失败处理：禁用 panic/unwrap/expect，强制显式错误传播
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"
expect_used = "deny"
let_underscore_must_use = "deny"
# 模式匹配
wildcard_enum_match_arm = "deny"
# 类型转换：精度损失/截断/符号丢失均需显式
cast_precision_loss = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
# 流程控制与设计
exit = "deny"
needless_pass_by_ref_mut = "deny"
use_self = "deny"
default_trait_access = "deny"
# 异步与并发（原误写在 .clippy.toml，此处为正确位置）
await_holding_lock = "deny"
large_futures = "deny"
verbose_file_reads = "warn"
# 显式风格约束（原误写在 .clippy.toml）
implicit_return = "warn"
# 与 implicit_return 成对：后者要求显式 return，本规则却惩罚尾部 return，
# 二者在 -D warnings 下矛盾，取"显式 return"风格须豁免本规则
needless_return = "allow"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"

# pedantic 中过于激进的子规则：豁免
module_name_repetitions = "allow"
must_use_candidate = "allow"
separated_literal_suffix = "allow"
missing_trait_methods = "allow"
single_call_fn = "allow"
# 文档：已 deny panic!/unwrap/expect，理论不会 panic，文档可豁免
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# 因显式引入部分 restriction lint，必须豁免其元 lint
blanket_clippy_restriction_lints = "allow"

# Rustdoc：文档质量门槛
[workspace.lints.rustdoc]
all = "deny"
missing_crate_level_docs = "deny"
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
invalid_rust_codeblocks = "deny"
redundant_explicit_links = "deny"
