# 基础格式
edition = "2024"
max_width = 100
tab_spaces = 4
hard_tabs = false
use_small_heuristics = "Default"
newline_style = "Unix"

# 导入排序(注意:只能"排序",不能"合并/分组",见文末)
reorder_imports = true
reorder_modules = true

# 表达式与控制流
match_block_trailing_comma = true
use_field_init_shorthand = true
use_try_shorthand = true
fn_call_width = 60
single_line_if_else_max_width = 50

# ---------------------------------------------------------------------------
# 关于 nightly-only 选项
#
# 工具链锁的是 stable 1.97。stable 的 rustfmt 只认上面这些键；
# 下面这些**看起来该配、实际被静默忽略**的选项已从文件中移除，
# 免得每次 `cargo fmt` 刷一屏 "unstable features are only available in nightly"：
#
#   导入：imports_granularity / group_imports
#   注释：comment_width / wrap_comments / normalize_comments / normalize_doc_attributes
#   文档：format_code_in_doc_comments
#   宏：  format_macro_matchers / format_macro_bodies / hex_literal_case
#   布局：brace_style / control_brace_style / trailing_comma / trailing_semicolon
#         blank_lines_lower_bound / blank_lines_upper_bound / inline_attribute_width
#         struct_field_align_threshold / enum_discrim_align_threshold
#         fn_single_line / where_single_line / empty_item_single_line
#         indent_style / condense_wildcard_suffixes
#
# 如果确实想要"按 crate 合并导入 + 注释自动换行"：
#   1. `rustup component add rustfmt --toolchain nightly`
#   2. 把上述键加回来，用 `cargo +nightly fmt` 格式化（编译仍走 stable）。
# 目前不这么做：为了格式化装第二个工具链，收益不抵复杂度。
# ---------------------------------------------------------------------------
